<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebRTC Walkie Talkie Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* Custom Walkie Talkie Styles */
        body {
            background-color: #1a1a1a;
            background-image: radial-gradient(circle at center, #2a2a2a 0%, #111 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            touch-action: pan-y; /* Optimal untuk mobile: cegah zoom layar tapi izinkan scroll */
            -webkit-tap-highlight-color: transparent;
        }

        .walkie-body {
            background: linear-gradient(145deg, #2b3327, #1a2017);
            border-radius: 30px;
            box-shadow: 
                -10px 10px 20px #0a0d09,
                10px -10px 20px #34412f,
                inset 2px 2px 5px rgba(255,255,255,0.1),
                inset -5px -5px 15px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
        }

        .antenna {
            position: absolute;
            top: -80px;
            right: 40px;
            width: 24px;
            height: 100px;
            background: linear-gradient(to right, #111, #333, #111);
            border-radius: 12px 12px 0 0;
            z-index: 1;
            box-shadow: inset -2px 0 5px rgba(0,0,0,0.5);
        }
        
        .antenna::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -4px;
            width: 32px;
            height: 20px;
            background: #222;
            border-radius: 5px 5px 0 0;
        }

        .volume-knob {
            position: absolute;
            top: -25px;
            left: 50px;
            width: 40px;
            height: 30px;
            background: repeating-linear-gradient(90deg, #222, #222 2px, #444 2px, #444 4px);
            border-radius: 5px 5px 0 0;
            z-index: 1;
        }

        .lcd-screen {
            background: #8b9d77;
            font-family: 'Share Tech Mono', monospace;
            box-shadow: inset 2px 2px 10px rgba(0,0,0,0.5);
            text-shadow: 1px 1px 0px rgba(162, 185, 137, 0.5);
            position: relative;
            overflow: hidden;
        }

        .lcd-screen.active {
            background: #a3c482;
            box-shadow: inset 2px 2px 10px rgba(0,0,0,0.4), 0 0 15px rgba(163, 196, 130, 0.4);
        }

        /* Video Mode Styles */
        .video-feed {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .pip-video {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 70px;
            height: 90px;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 6px;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .lcd-screen.video-mode {
            background: #111;
        }
        .lcd-screen.video-mode .video-feed,
        .lcd-screen.video-mode .pip-video {
            opacity: 1;
        }
        .lcd-content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .lcd-screen.video-mode .lcd-content {
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.8);
        }
        .lcd-screen.video-mode #rx-indicator {
            color: #4ade80; 
        }

        .ptt-button {
            background: linear-gradient(145deg, #d32f2f, #b71c1c);
            box-shadow: 
                -4px 4px 10px #11150f,
                4px -4px 10px #3f4d39,
                inset 2px 2px 5px rgba(255,100,100,0.4);
            transition: all 0.1s ease;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }

        .ptt-button:active, .ptt-button.pressed {
            background: #9a0007;
            box-shadow: 
                inset 4px 4px 10px rgba(0,0,0,0.6),
                inset -2px -2px 5px rgba(255,255,255,0.1);
            transform: scale(0.96) translateY(2px);
        }

        .speaker-grille {
            background: radial-gradient(#111 20%, transparent 25%);
            background-size: 10px 10px;
            opacity: 0.8;
        }

        @keyframes pulse-tx {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .tx-indicator {
            display: none;
        }
        .transmitting .tx-indicator {
            display: inline-block;
            animation: pulse-tx 0.8s infinite;
            color: #d32f2f;
            text-shadow: 0 0 5px red;
        }

        /* Styling native button untuk HP */
        button {
            touch-action: manipulation;
        }
    </style>
</head>
<body class="text-gray-200 antialiased">

    <!-- Main Walkie Talkie Device -->
    <div class="relative w-80 max-w-[95vw] mt-16 mb-8">
        <div class="antenna"></div>
        <div class="volume-knob"></div>

        <div class="walkie-body p-6 border-4 border-[#1a2017]">
            <!-- Brand / Top Area -->
            <div class="flex justify-between items-center mb-4 text-xs font-bold tracking-widest text-gray-500 uppercase">
                <span>Comms-Pro</span>
                <span class="w-3 h-3 rounded-full bg-red-900 border border-gray-800 shadow-[inset_0_1px_3px_rgba(0,0,0,0.8)]" id="power-led"></span>
            </div>

            <!-- LCD / Video Screen -->
            <div id="lcd" class="lcd-screen rounded-lg h-44 mb-6 text-[#111] transition-all duration-300">
                <video id="remote-video" class="video-feed" autoplay playsinline></video>
                <video id="local-video" class="pip-video" autoplay playsinline muted></video>
                
                <div class="lcd-content p-3">
                    <div class="flex justify-between items-start">
                        <span class="text-sm font-bold tx-indicator">TX</span>
                        <span id="rx-indicator" class="text-sm font-bold opacity-0 transition-opacity text-green-900">RX</span>
                        <span id="status-icon" class="text-sm">✖</span>
                    </div>
                    <div class="text-center">
                        <div id="lcd-status" class="text-lg font-bold uppercase tracking-wider mb-1">Offline</div>
                        <div id="lcd-room" class="text-2xl font-bold tracking-widest">---</div>
                    </div>
                </div>
            </div>

          <!-- Connection Controls -->
<div id="setup-panel" class="space-y-4 mb-6">
    <div id="auto-connect-msg" class="text-center text-gray-400 font-mono text-sm animate-pulse">
        Menghubungkan ke Saluran Utama...
    </div>
    <button id="btn-force-connect" class="hidden w-full bg-green-800 hover:bg-green-700 active:bg-green-600 text-white font-bold py-4 px-4 rounded-lg shadow-[inset_0_1px_0_rgba(255,255,255,0.1),_0_2px_4px_rgba(0,0,0,0.5)] border border-green-900 transition-colors">
        TAP UNTUK CONNECT
    </button>
</div>

            <!-- Active Call Controls -->
            <div id="call-panel" class="hidden mb-6 flex flex-col items-center">
                <button id="btn-copy" class="mb-4 text-xs bg-gray-800 text-gray-300 py-1 px-3 rounded shadow border border-gray-700 hover:text-white active:bg-gray-700">
                    Copy Room ID
                </button>
                
                <div class="flex space-x-2 mb-3">
                    <button id="btn-toggle-video" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 py-1.5 px-3 rounded shadow border border-gray-700 flex items-center space-x-1 transition-colors active:bg-gray-700">
                        <span id="video-icon">📷</span>
                        <span id="video-btn-text">Kamera: ON</span>
                    </button>
                </div>
                
                <p class="text-xs text-center text-gray-400 mb-2 font-mono">HOLD TO SPEAK</p>
                
                <!-- Tombol PTT menggunakan Event Pointer Khusus Layar Sentuh -->
                <button id="btn-ptt" class="ptt-button w-32 h-32 rounded-full flex items-center justify-center border-4 border-[#111]">
                    <span class="text-white font-bold text-xl tracking-wider text-shadow-sm">PTT</span>
                </button>
                
                <button id="btn-hangup" class="mt-8 text-xs text-red-500 hover:text-red-400 active:text-red-300 uppercase tracking-widest font-bold p-2">
                    Disconnect
                </button>
            </div>

            <div class="h-24 w-full speaker-grille rounded-lg border border-gray-900 shadow-[inset_0_2px_10px_rgba(0,0,0,0.8)]"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        
        // PASTE KODE BARU ANDA DI SINI (Perhatikan ada tambahan getDoc di dalamnya)
        import { getFirestore, doc, setDoc, updateDoc, deleteDoc, collection, onSnapshot, addDoc, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global state variables
        let app, db, auth;
        let appId = 'walkie-talkie-public-rooms'; // Fixed ID karena di luar Gemini
        let peerConnection = null;
        let localStream = null;
        let remoteStream = null;
        let roomId = null;
        let isCaller = false;
        let unsubscribers = [];
        let audioContext = null;
        const FIXED_ROOM_ID = "SALURAN_UTAMA_01"; // ID ini yang akan selalu dipakai

        const configuration = {
            iceServers: [
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        };

        const ui = {
            lcd: document.getElementById('lcd'),
            lcdStatus: document.getElementById('lcd-status'),
            lcdRoomText: document.getElementById('lcd-room'),
            statusIcon: document.getElementById('status-icon'),
            rxIndicator: document.getElementById('rx-indicator'),
            setupPanel: document.getElementById('setup-panel'),
            callPanel: document.getElementById('call-panel'),
            btnCreate: document.getElementById('btn-create'),
            btnJoin: document.getElementById('btn-join'),
            joinInput: document.getElementById('join-room-id'),
            btnPtt: document.getElementById('btn-ptt'),
            btnHangup: document.getElementById('btn-hangup'),
            btnCopy: document.getElementById('btn-copy'),
            btnToggleVideo: document.getElementById('btn-toggle-video'),
            videoIcon: document.getElementById('video-icon'),
            videoBtnText: document.getElementById('video-btn-text'),
            remoteVideo: document.getElementById('remote-video'),
            localVideo: document.getElementById('local-video'),
            powerLed: document.getElementById('power-led')
        };

        async function initApp() {
            try {
                // Konfigurasi Firebase Anda
                const myFirebaseConfig = {
                    apiKey: "AIzaSyB8Z9x6ovw6AW-bvCJr02Gdzb1-WKMPefw",
                    authDomain: "walkitalki-6985b.firebaseapp.com",
                    projectId: "walkitalki-6985b",
                    storageBucket: "walkitalki-6985b.firebasestorage.app",
                    messagingSenderId: "503583235135",
                    appId: "1:503583235135:web:7fa355d440ce17cf402c8a"
                };
                
                app = initializeApp(myFirebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                await signInAnonymously(auth); 
                
                updateLCD("READY", "---", "●");
                ui.powerLed.classList.remove('bg-red-900');
                ui.powerLed.classList.add('bg-green-500', 'shadow-[0_0_8px_#4ade80]');
                ui.lcd.classList.add('active');
autoConnect();
                // PERBAIKAN: Jangan auto-request kamera saat dimuat. 
                // Di handphone, ini memicu browser memblokir semua eksekusi karena dianggap tidak sah.

            } catch (error) {
                console.error("Firebase init error:", error);
                alert("Gagal terhubung ke Firebase: " + error.message);
                updateLCD("ERR: AUTH", "---", "✖");
            }
        }

        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function playSfx(type) {
            if (!audioContext) return;
            try {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                const now = audioContext.currentTime;

                if (type === 'tx-start') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'tx-end') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, now);
                    osc.frequency.setValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.setValueAtTime(0.1, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                }
            } catch(e) { console.error("Audio error", e); }
        }

        async function openUserMedia() {
            try {
                // Penyesuaian agar kamera support penuh di HP Android/iOS (meminta kamera depan)
                const constraints = {
                    video: { facingMode: "user" },
                    audio: { echoCancellation: true, noiseSuppression: true }
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                ui.localVideo.srcObject = localStream;
                ui.lcd.classList.add('video-mode');
                
                localStream.getAudioTracks().forEach(track => { track.enabled = false; });
                return true;
            } catch (error) {
                console.error("Error media devices:", error);
                alert("Gagal membuka Kamera/Mikrofon. Pastikan Anda memberi izin pada pop-up browser.\n\nDetail: " + error.message);
                updateLCD("NO CAM/MIC", "---", "✖");
                return false;
            }
        }

      async function autoConnect() {
    if (!auth.currentUser) return;

    // Inisialisasi Audio (mungkin butuh interaksi user)
    initAudioContext();

    if (!localStream) {
        updateLCD("MINTA IZIN", "...", "⧖");
        const hasMedia = await openUserMedia();
        if (!hasMedia) {
            // Jika browser memblokir auto-play kamera/mic, tampilkan tombol
            document.getElementById('auto-connect-msg').classList.add('hidden');
            document.getElementById('btn-force-connect').classList.remove('hidden');
            updateLCD("BUTUH TAP", "---", "✖");
            return;
        }
    }

    updateLCD("CONNECTING", "CH-1", "⧖");
    roomId = FIXED_ROOM_ID;
    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
    
    try {
        const roomSnap = await getDoc(roomRef);
        peerConnection = new RTCPeerConnection(configuration);
        setupWebRTCListeners();
        
        localStream.getTracks().forEach(track => {
            peerConnection.addTrack(track, localStream);
        });

        // JIKA ROOM SUDAH ADA (JADI JOINER)
        if (roomSnap.exists() && roomSnap.data().offer) {
            isCaller = false;
            const roomData = roomSnap.data();
            
            const calleeCandidatesCollection = collection(roomRef, 'calleeCandidates');
            peerConnection.addEventListener('icecandidate', event => {
                if (event.candidate) addDoc(calleeCandidatesCollection, event.candidate.toJSON());
            });

            await peerConnection.setRemoteDescription(new RTCSessionDescription(roomData.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            await updateDoc(roomRef, { answer: { type: answer.type, sdp: answer.sdp } });
            
            showCallPanel("CH-1");
            updateLCD("CONNECTED", "CH-1", "✔");

            const callerCandidatesCollection = collection(roomRef, 'callerCandidates');
            const unsubCaller = onSnapshot(callerCandidatesCollection, snapshot => {
                if (!peerConnection) return;
                snapshot.docChanges().forEach(async change => {
                    if (change.type === 'added') await peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                });
            });
            unsubscribers.push(unsubCaller);

        } 
        // JIKA ROOM BELUM ADA (JADI CREATOR)
        else {
            isCaller = true;
            await setDoc(roomRef, { createdAt: new Date().toISOString() });

            const callerCandidatesCollection = collection(roomRef, 'callerCandidates');
            peerConnection.addEventListener('icecandidate', event => {
                if (event.candidate) addDoc(callerCandidatesCollection, event.candidate.toJSON());
            });

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            await updateDoc(roomRef, { offer: { type: offer.type, sdp: offer.sdp } });
            
            showCallPanel("CH-1");
            updateLCD("WAITING", "CH-1", "⧖");

            const unsubRoom = onSnapshot(roomRef, async snapshot => {
                if (!peerConnection) return; 
                const data = snapshot.data();
                if (!peerConnection.currentRemoteDescription && data && data.answer) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                    updateLCD("CONNECTED", "CH-1", "✔");
                }
            });
            unsubscribers.push(unsubRoom);

            const calleeCandidatesCollection = collection(roomRef, 'calleeCandidates');
            const unsubCallee = onSnapshot(calleeCandidatesCollection, snapshot => {
                if (!peerConnection) return;
                snapshot.docChanges().forEach(async change => {
                    if (change.type === 'added') await peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                });
            });
            unsubscribers.push(unsubCallee);
        }
    } catch (err) {
        alert("Gagal koneksi: " + err.message);
        hangUp();
    }
}

        function setupWebRTCListeners() {
            peerConnection.addEventListener('track', event => {
                if (!remoteStream) {
                    remoteStream = new MediaStream();
                    ui.remoteVideo.srcObject = remoteStream;
                }
                remoteStream.addTrack(event.track);
            });

            peerConnection.addEventListener('connectionstatechange', () => {
                if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') {
                    alert("Koneksi terputus dengan perangkat lawan.");
                    hangUp();
                } else if (peerConnection.connectionState === 'connected') {
                    setupAudioLevelMonitor();
                }
            });
        }

        let isTransmitting = false;

        function startPTT(e) {
            e.preventDefault(); 
            if (!peerConnection || peerConnection.connectionState !== 'connected' || isTransmitting) return;
            
            isTransmitting = true;
            ui.btnPtt.classList.add('pressed');
            ui.lcd.classList.add('transmitting');
            
            playSfx('tx-start');
            if (localStream) {
                localStream.getAudioTracks().forEach(track => { track.enabled = true; });
            }
        }

        function stopPTT(e) {
            e.preventDefault();
            if (!isTransmitting) return;

            isTransmitting = false;
            ui.btnPtt.classList.remove('pressed');
            ui.lcd.classList.remove('transmitting');

            if (localStream) {
                localStream.getAudioTracks().forEach(track => { track.enabled = false; });
            }
            playSfx('tx-end');
        }

        // PERBAIKAN: Gunakan PointerEvents (Sangat optimal untuk Mobile & Desktop)
        ui.btnPtt.addEventListener('pointerdown', startPTT);
        ui.btnPtt.addEventListener('pointerup', stopPTT);
        ui.btnPtt.addEventListener('pointerleave', stopPTT);
        ui.btnPtt.addEventListener('pointercancel', stopPTT);


        function setupAudioLevelMonitor() {
            if (!audioContext || !remoteStream) return;
            
            const source = audioContext.createMediaStreamSource(remoteStream);
            const analyzer = audioContext.createAnalyser();
            analyzer.fftSize = 256;
            source.connect(analyzer);

            const dataArray = new Uint8Array(analyzer.frequencyBinCount);

            function checkLevel() {
                if (peerConnection && peerConnection.connectionState === 'connected') {
                    analyzer.getByteFrequencyData(dataArray);
                    
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) { sum += dataArray[i]; }
                    const average = sum / dataArray.length;

                    if (average > 5 && !isTransmitting) {
                        ui.rxIndicator.style.opacity = '1';
                    } else {
                        ui.rxIndicator.style.opacity = '0';
                    }
                    requestAnimationFrame(checkLevel);
                } else {
                    ui.rxIndicator.style.opacity = '0';
                }
            }
            checkLevel();
        }

        function updateLCD(status, roomStr, icon) {
            ui.lcdStatus.innerText = status;
            ui.lcdRoomText.innerText = roomStr || "---";
            ui.statusIcon.innerText = icon || "";
        }

        function showCallPanel(shortId) {
            ui.setupPanel.classList.add('hidden');
            ui.callPanel.classList.remove('hidden');
            ui.lcdRoomText.innerText = shortId;
        }

        async function hangUp() {
            unsubscribers.forEach(unsub => unsub());
            unsubscribers = [];

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            remoteStream = null;
            
            ui.remoteVideo.srcObject = null;
            ui.localVideo.srcObject = null;
            ui.lcd.classList.remove('video-mode');

            if (isCaller && roomId && auth.currentUser) {
                try {
                   await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId));
                } catch(e) {}
            }

            roomId = null;
            isCaller = false;
            
            ui.callPanel.classList.add('hidden');
            ui.setupPanel.classList.remove('hidden');
            updateLCD("READY", "---", "●");
            ui.rxIndicator.style.opacity = '0';
        }

        // Listener jika browser memblokir auto-connect dan memaksa butuh tap user
document.getElementById('btn-force-connect').addEventListener('click', () => {
    document.getElementById('btn-force-connect').classList.add('hidden');
    document.getElementById('auto-connect-msg').classList.remove('hidden');
    autoConnect();
});

        ui.btnHangup.addEventListener('click', hangUp);

        ui.btnCopy.addEventListener('click', () => {
            const shortId = ui.lcdRoomText.innerText;
            if (shortId && shortId !== '---') {
                navigator.clipboard.writeText(shortId).then(() => {
                    const originalText = ui.btnCopy.innerText;
                    ui.btnCopy.innerText = "Copied!";
                    setTimeout(() => ui.btnCopy.innerText = originalText, 2000);
                }).catch(e => {
                    // Fallback untuk HP lama
                    const el = document.createElement('textarea');
                    el.value = shortId;
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                    const originalText = ui.btnCopy.innerText;
                    ui.btnCopy.innerText = "Copied!";
                    setTimeout(() => ui.btnCopy.innerText = originalText, 2000);
                });
            }
        });

        let isVideoEnabled = true;
        
        ui.btnToggleVideo.addEventListener('click', async () => {
            if (!localStream) return;

            if (isVideoEnabled) {
                const videoTrack = localStream.getVideoTracks()[0];
                if (videoTrack) {
                    videoTrack.stop(); 
                    localStream.removeTrack(videoTrack); 
                }
                isVideoEnabled = false;
                ui.videoIcon.innerText = "🚫";
                ui.videoBtnText.innerText = "Kamera: OFF";
                ui.localVideo.classList.add('opacity-20', 'grayscale');
            } else {
                try {
                    const newStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    const newVideoTrack = newStream.getVideoTracks()[0];
                    localStream.addTrack(newVideoTrack);
                    ui.localVideo.srcObject = localStream;
                    
                    if (peerConnection) {
                        const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (sender) sender.replaceTrack(newVideoTrack);
                        else peerConnection.addTrack(newVideoTrack, localStream);
                    }

                    isVideoEnabled = true;
                    ui.videoIcon.innerText = "📷";
                    ui.videoBtnText.innerText = "Kamera: ON";
                    ui.localVideo.classList.remove('opacity-20', 'grayscale');
                } catch (error) {
                    alert("Gagal menyalakan kembali kamera.");
                }
            }
        });

        // Jalankan aplikasi
        initApp();
window.addEventListener('beforeunload', () => {
    hangUp();
});
    </script>
</body>
</html>
