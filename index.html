<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebRTC Walkie Talkie Auto-Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* Custom Walkie Talkie Styles */
        body {
            background-color: #1a1a1a;
            background-image: radial-gradient(circle at center, #2a2a2a 0%, #111 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            touch-action: pan-y;
            -webkit-tap-highlight-color: transparent;
        }

        .walkie-body {
            background: linear-gradient(145deg, #2b3327, #1a2017);
            border-radius: 30px;
            box-shadow: 
                -10px 10px 20px #0a0d09,
                10px -10px 20px #34412f,
                inset 2px 2px 5px rgba(255,255,255,0.1),
                inset -5px -5px 15px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
        }

        .antenna {
            position: absolute;
            top: -80px;
            right: 40px;
            width: 24px;
            height: 100px;
            background: linear-gradient(to right, #111, #333, #111);
            border-radius: 12px 12px 0 0;
            z-index: 1;
            box-shadow: inset -2px 0 5px rgba(0,0,0,0.5);
        }
        
        .antenna::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -4px;
            width: 32px;
            height: 20px;
            background: #222;
            border-radius: 5px 5px 0 0;
        }

        .volume-knob {
            position: absolute;
            top: -25px;
            left: 50px;
            width: 40px;
            height: 30px;
            background: repeating-linear-gradient(90deg, #222, #222 2px, #444 2px, #444 4px);
            border-radius: 5px 5px 0 0;
            z-index: 1;
        }

        .lcd-screen {
            background: #8b9d77;
            font-family: 'Share Tech Mono', monospace;
            box-shadow: inset 2px 2px 10px rgba(0,0,0,0.5);
            text-shadow: 1px 1px 0px rgba(162, 185, 137, 0.5);
            position: relative;
            overflow: hidden;
        }

        .lcd-screen.active {
            background: #a3c482;
            box-shadow: inset 2px 2px 10px rgba(0,0,0,0.4), 0 0 15px rgba(163, 196, 130, 0.4);
        }

        .video-feed {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .pip-video {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 70px;
            height: 90px;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 6px;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .lcd-screen.video-mode {
            background: #111;
        }
        .lcd-screen.video-mode .video-feed,
        .lcd-screen.video-mode .pip-video {
            opacity: 1;
        }
        .lcd-content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .lcd-screen.video-mode .lcd-content {
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.8);
        }
        .lcd-screen.video-mode #rx-indicator {
            color: #4ade80; 
        }

        .ptt-button {
            background: linear-gradient(145deg, #d32f2f, #b71c1c);
            box-shadow: 
                -4px 4px 10px #11150f,
                4px -4px 10px #3f4d39,
                inset 2px 2px 5px rgba(255,100,100,0.4);
            transition: all 0.1s ease;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }

        .ptt-button:active, .ptt-button.pressed {
            background: #9a0007;
            box-shadow: 
                inset 4px 4px 10px rgba(0,0,0,0.6),
                inset -2px -2px 5px rgba(255,255,255,0.1);
            transform: scale(0.96) translateY(2px);
        }

        .speaker-grille {
            background: radial-gradient(#111 20%, transparent 25%);
            background-size: 10px 10px;
            opacity: 0.8;
        }

        @keyframes pulse-tx {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .tx-indicator {
            display: none;
        }
        .transmitting .tx-indicator {
            display: inline-block;
            animation: pulse-tx 0.8s infinite;
            color: #d32f2f;
            text-shadow: 0 0 5px red;
        }

        button {
            touch-action: manipulation;
        }
    </style>
</head>

                    <button id="btn-toggle-video" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 py-1.5 px-3 rounded shadow border border-gray-700 flex items-center space-x-1 transition-colors active:bg-gray-700">
                        <span id="video-icon">📷</span>
                        <span id="video-btn-text">Kamera: ON</span>
                    </button>
                </div>
                
                <p class="text-xs text-center text-gray-400 mb-2 font-mono">HOLD TO SPEAK</p>
                
                <button id="btn-ptt" class="ptt-button w-32 h-32 rounded-full flex items-center justify-center border-4 border-[#111]">
                    <span class="text-white font-bold text-xl tracking-wider text-shadow-sm">PTT</span>
                </button>
                
                <button id="btn-hangup" class="mt-8 text-xs text-red-500 hover:text-red-400 active:text-red-300 uppercase tracking-widest font-bold p-2">
                    Disconnect
                </button>
            </div>

            <div class="h-24 w-full speaker-grille rounded-lg border border-gray-900 shadow-[inset_0_2px_10px_rgba(0,0,0,0.8)]"></div>
        </div>
    </div>
