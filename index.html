<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebRTC Walkie Talkie Mobile - VIP Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        /* Custom Walkie Talkie Styles */
        body {
            background-color: #1a1a1a;
            background-image: radial-gradient(circle at center, #2a2a2a 0%, #111 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            touch-action: pan-y;
            -webkit-tap-highlight-color: transparent;
        }

        .walkie-body {
            background: linear-gradient(145deg, #2b3327, #1a2017);
            border-radius: 30px;
            box-shadow: 
                -10px 10px 20px #0a0d09,
                10px -10px 20px #34412f,
                inset 2px 2px 5px rgba(255,255,255,0.1),
                inset -5px -5px 15px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
        }

        .antenna {
            position: absolute;
            top: -80px;
            right: 40px;
            width: 24px;
            height: 100px;
            background: linear-gradient(to right, #111, #333, #111);
            border-radius: 12px 12px 0 0;
            z-index: 1;
            box-shadow: inset -2px 0 5px rgba(0,0,0,0.5);
        }
        
        .antenna::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -4px;
            width: 32px;
            height: 20px;
            background: #222;
            border-radius: 5px 5px 0 0;
        }

        .volume-knob {
            position: absolute;
            top: -25px;
            left: 50px;
            width: 40px;
            height: 30px;
            background: repeating-linear-gradient(90deg, #222, #222 2px, #444 2px, #444 4px);
            border-radius: 5px 5px 0 0;
            z-index: 1;
        }

        .lcd-screen {
            background: #8b9d77;
            font-family: 'Share Tech Mono', monospace;
            box-shadow: inset 2px 2px 10px rgba(0,0,0,0.5);
            text-shadow: 1px 1px 0px rgba(162, 185, 137, 0.5);
            position: relative;
            overflow: hidden;
        }

        .lcd-screen.active {
            background: #a3c482;
            box-shadow: inset 2px 2px 10px rgba(0,0,0,0.4), 0 0 15px rgba(163, 196, 130, 0.4);
        }

        /* Video Mode Styles */
        .video-feed {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .pip-video {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 70px;
            height: 90px;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 6px;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .lcd-screen.video-mode {
            background: #111;
        }
        .lcd-screen.video-mode .video-feed,
        .lcd-screen.video-mode .pip-video {
            opacity: 1;
        }
        .lcd-content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .lcd-screen.video-mode .lcd-content {
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.8);
        }
        .lcd-screen.video-mode #rx-indicator {
            color: #4ade80; 
        }

        .ptt-button {
            background: linear-gradient(145deg, #d32f2f, #b71c1c);
            box-shadow: 
                -4px 4px 10px #11150f,
                4px -4px 10px #3f4d39,
                inset 2px 2px 5px rgba(255,100,100,0.4);
            transition: all 0.1s ease;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }

        .ptt-button:active, .ptt-button.pressed {
            background: #9a0007;
            box-shadow: 
                inset 4px 4px 10px rgba(0,0,0,0.6),
                inset -2px -2px 5px rgba(255,255,255,0.1);
            transform: scale(0.96) translateY(2px);
        }

        .speaker-grille {
            background: radial-gradient(#111 20%, transparent 25%);
            background-size: 10px 10px;
            opacity: 0.8;
        }

        @keyframes pulse-tx {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .tx-indicator {
            display: none;
        }
        .transmitting .tx-indicator {
            display: inline-block;
            animation: pulse-tx 0.8s infinite;
            color: #d32f2f;
            text-shadow: 0 0 5px red;
        }

        button {
            touch-action: manipulation;
        }
    </style>
</head>

    <script type="module">

        // INIT SUPABASE
        const SUPABASE_URL = 'https://tigszfvmbpvznotykryx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpZ3N6ZnZtYnB2em5vdHlrcnl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3MzQwMjcsImV4cCI6MjA5OTMxMDAyN30.O0-y9FI_sikkPVig2XNDJ_zlTnfJZv-hRirPurs8yQc';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Global state variables
        let myId = null;     // Diambil dari Employee Code
        let myName = null;   // Diambil dari Employee Name
        let app, db, auth;
        let appId = 'walkie-talkie-public-rooms';

        const configuration = {

        const ui = {

            rxIndicator: document.getElementById('rx-indicator'),
            loginPanel: document.getElementById('login-panel'),

            btnLogout: document.getElementById('btn-logout'),
            setupPanel: document.getElementById('setup-panel'),
            permissionMsg: document.getElementById('permission-msg'),
            dialPanel: document.getElementById('dial-panel'),
            callPanel: document.getElementById('call-panel'),
            btnForceConnect: document.getElementById('btn-force-connect'),

            btnHangup: document.getElementById('btn-hangup'),
            btnPtt: document.getElementById('btn-ptt'),
            btnToggleVideo: document.getElementById('btn-toggle-video'),
            videoIcon: document.getElementById('video-icon'),
            videoBtnText: document.getElementById('video-btn-text'),
            remoteVideo: document.getElementById('remote-video'),
            localVideo: document.getElementById('local-video'),
            powerLed: document.getElementById('power-led'),
            targetIdInput: document.getElementById('target-id-input'),
            myIdDisplay: document.getElementById('my-id-display'),
            employeeNameDisplay: document.getElementById('employee-name-display')
        };

        // CEK LOGIN
        function checkAuth() {
            const storedCode = localStorage.getItem('walkie_emp_code');
            const storedName = localStorage.getItem('walkie_emp_name');

            if (storedCode && storedName) {
                myId = storedCode;
                myName = storedName;
                ui.myIdDisplay.innerText = myId;
                ui.employeeNameDisplay.innerText = myName;
                
                ui.loginPanel.classList.add('hidden');
                ui.setupPanel.classList.remove('hidden');
                initFirebaseApp(); // Mulai Firebase
            } else {
                ui.powerLed.classList.add('bg-red-900');
                updateLCD("LOGIN", "...", "●");
            }
        }

        // PROSES LOGIN DARI SUPABASE
        ui.btnLogin.addEventListener('click', async () => {
            const code = ui.loginCodeInput.value.trim().toUpperCase();
            if(!code) return;

            ui.btnLogin.innerText = "MEMVERIFIKASI...";
            
            // Query Supabase untuk cek pegawai
            const { data, error } = await supabase
                .from('employees')
                .select('code, name')
                .eq('code', code)
                .single();

            if (error || !data) {

                ui.btnLogin.innerText = "MASUK";

            // Simpan identitas ke LocalStorage
            localStorage.setItem('walkie_emp_code', data.code);
            localStorage.setItem('walkie_emp_name', data.name);

            checkAuth(); // Lanjut ke step berikutnya

        // PROSES LOGOUT
        ui.btnLogout.addEventListener('click', async () => {

            localStorage.removeItem('walkie_emp_code');
            localStorage.removeItem('walkie_emp_name');
            window.location.reload();

        // INISIALISASI FIREBASE
        async function initFirebaseApp() {
            try {
                const myFirebaseConfig = {
                    apiKey: "AIzaSyB8Z9x6ovw6AW-bvCJr02Gdzb1-WKMPefw",
                    authDomain: "walkitalki-6985b.firebaseapp.com",
                    projectId: "walkitalki-6985b",
                    storageBucket: "walkitalki-6985b.firebasestorage.app",
                    messagingSenderId: "503583235135",
                    appId: "1:503583235135:web:7fa355d440ce17cf402c8a"
                };
                
                app = initializeApp(myFirebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                await signInAnonymously(auth); 
                
                ui.powerLed.classList.remove('bg-red-900');
                ui.powerLed.classList.add('bg-green-500', 'shadow-[0_0_8px_#4ade80]');

                startDevice();

                alert("Gagal terhubung ke Server Komunikasi: " + error.message);
                updateLCD("ERR: AUTH", "---", "✖");
            }
        }

        function initAudioContext() {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') audioContext.resume();
        }

        function playSfx(type) {
            if (!audioContext) return;
            try {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                const now = audioContext.currentTime;

                if (type === 'tx-start') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'tx-end') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, now);
                    osc.frequency.setValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.setValueAtTime(0.1, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                }
            } catch(e) {}
        }

        async function openUserMedia() {
            try {
                const constraints = {
                    video: { facingMode: "user" },
                    audio: { echoCancellation: true, noiseSuppression: true }
                };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                ui.localVideo.srcObject = localStream;
                ui.lcd.classList.add('video-mode');
                
                localStream.getAudioTracks().forEach(track => { track.enabled = false; });
                return true;
            } catch (error) {
                return false;
            }
        }

        async function startDevice() {
            initAudioContext();
            if (!localStream) {
                updateLCD("MINTA IZIN", "...", "⧖");
                const hasMedia = await openUserMedia();
                if (!hasMedia) {
                    ui.permissionMsg.classList.remove('hidden');
                    ui.btnForceConnect.classList.remove('hidden');
                    ui.dialPanel.classList.add('hidden');
                    updateLCD("BUTUH TAP", "---", "✖");
                    return;
                }
            }

            ui.permissionMsg.classList.add('hidden');
            ui.btnForceConnect.classList.add('hidden');
            ui.dialPanel.classList.remove('hidden');

            // Standby pada ID (Code Pegawai) miliknya sendiri
            connectToRoom(myId);
        }

        async function connectToRoom(targetRoomId) {
            if (!auth.currentUser) return;
            
            roomId = targetRoomId;
            const isMyOwnRoom = (roomId === myId);
            
            updateLCD(isMyOwnRoom ? "STANDBY" : "CALLING...", roomId, "⧖");
            
            if (isMyOwnRoom) {
                showSetupPanel();
            } else {
                showCallPanel(roomId);
            }

            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
            
            try {
                peerConnection = new RTCPeerConnection(configuration);
                setupWebRTCListeners();
                
                if (localStream) {
                    localStream.getTracks().forEach(track => {
                        peerConnection.addTrack(track, localStream);
                    });
                }

                let roomSnap = await getDoc(roomRef);

                if (!roomSnap.exists()) {
                    try {
                        await setDoc(roomRef, { createdAt: new Date().toISOString(), creator: auth.currentUser.uid });
                        isCaller = true;
                        
                        const unsubRoom = onSnapshot(roomRef, async snapshot => {
                            if (!peerConnection) return; 
                            if (!snapshot.exists()) {
                                handleDisconnect();
                                return;
                            }

                            const data = snapshot.data();
                            if (!peerConnection.currentRemoteDescription && data && data.answer) {
                                try {
                                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                                } catch (e) {}
                            }
                        });
                        unsubscribers.push(unsubRoom);

                        const callerCandidatesCollection = collection(roomRef, 'callerCandidates');
                        peerConnection.addEventListener('icecandidate', event => {
                            if (event.candidate) addDoc(callerCandidatesCollection, event.candidate.toJSON());
                        });

                        const offer = await peerConnection.createOffer();
                        await peerConnection.setLocalDescription(offer);
                        await updateDoc(roomRef, { offer: { type: offer.type, sdp: offer.sdp } });
                        
                        const calleeCandidatesCollection = collection(roomRef, 'calleeCandidates');
                        const unsubCallee = onSnapshot(calleeCandidatesCollection, snapshot => {
                            if (!peerConnection) return;
                            snapshot.docChanges().forEach(async change => {
                                if (change.type === 'added') {
                                     if (peerConnection.remoteDescription) {
                                         try {
                                            await peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                                         } catch(e) {}
                                     }
                                }
                            });
                        });
                        unsubscribers.push(unsubCallee);
                        return; 
                    } catch (createErr) {
                        roomSnap = await getDoc(roomRef);
                    }
                }

                isCaller = false;
                const unsubRoom = onSnapshot(roomRef, async snapshot => {
                    if (!peerConnection) return;
                    if (!snapshot.exists()) {
                        handleDisconnect();
                        return;
                    }

                    const roomData = snapshot.data();
                    if (roomData.offer && !peerConnection.currentRemoteDescription) {
                        try {
                            await peerConnection.setRemoteDescription(new RTCSessionDescription(roomData.offer));
                            const answer = await peerConnection.createAnswer();
                            await peerConnection.setLocalDescription(answer);
                            await updateDoc(roomRef, { answer: { type: answer.type, sdp: answer.sdp } });
                        } catch(e) {}
                    }
                });
                unsubscribers.push(unsubRoom);

                const callerCandidatesCollection = collection(roomRef, 'callerCandidates');
                const unsubCaller = onSnapshot(callerCandidatesCollection, snapshot => {
                    if (!peerConnection) return;
                    snapshot.docChanges().forEach(async change => {
                        if (change.type === 'added') {
                            if (peerConnection.remoteDescription) {
                                try {
                                    await peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                                } catch(e) {}
                            }
                        }
                    });
                });
                unsubscribers.push(unsubCaller);

                const calleeCandidatesCollection = collection(roomRef, 'calleeCandidates');
                peerConnection.addEventListener('icecandidate', event => {
                    if (event.candidate) addDoc(calleeCandidatesCollection, event.candidate.toJSON());
                });

                if (roomSnap.exists() && roomSnap.data().offer && !peerConnection.currentRemoteDescription) {
                    const roomData = roomSnap.data();
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(roomData.offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    await updateDoc(roomRef, { answer: { type: answer.type, sdp: answer.sdp } });
                }

            } catch (err) {
                handleDisconnect();
            }
        }

        function setupWebRTCListeners() {
            peerConnection.addEventListener('track', event => {
                if (!remoteStream) {
                    remoteStream = new MediaStream();
                    ui.remoteVideo.srcObject = remoteStream;
                }
                remoteStream.addTrack(event.track);
            });

            peerConnection.addEventListener('connectionstatechange', () => {
                if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') {
                    handleDisconnect();
                } else if (peerConnection.connectionState === 'connected') {
                    setupAudioLevelMonitor();
                    updateLCD("CONNECTED", roomId, "✔");
                    showCallPanel(roomId);
                }
            });
        }

        function handleDisconnect() {
            updateLCD("DROPPED", "---", "✖");
            setTimeout(async () => {
                await cleanupConnection();
                connectToRoom(myId); 
            }, 1500);
        }

        async function cleanupConnection() {
            unsubscribers.forEach(unsub => unsub());
            unsubscribers = [];

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            
            remoteStream = null;
            ui.remoteVideo.srcObject = null;
            ui.rxIndicator.style.opacity = '0';

            if (roomId && auth.currentUser) {
                try {
                   await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId));
                } catch(e) {}
            }
            roomId = null;
            isCaller = false;
        }

        // --- BUTTON ACTIONS ---

        ui.btnConnect.addEventListener('click', async () => {
            const target = ui.targetIdInput.value.trim().toUpperCase();
            if (!target) {
                alert("Masukkan Code Pegawai tujuan!");
                return;
            }
            if (target === myId) {
                alert("Tidak bisa memanggil diri sendiri!");
                return;
            }

            ui.btnConnect.disabled = true;
            ui.btnConnect.innerText = "MENCARI...";

            // Verifikasi apakah kode tujuan ada di Supabase
            const { data, error } = await supabase
                .from('employees')
                .select('name')
                .eq('code', target)
                .single();

            if (error || !data) {
                alert("Code Pegawai tujuan tidak ditemukan di Database!");
                ui.btnConnect.disabled = false;
                ui.btnConnect.innerText = "PANGGIL";
                return;
            }

            ui.btnConnect.innerText = "MEMANGGIL...";

            await cleanupConnection(); 
            connectToRoom(target);     
            
            ui.btnConnect.disabled = false;
            ui.btnConnect.innerText = "PANGGIL";
            ui.targetIdInput.value = ""; 
        });

        ui.btnHangup.addEventListener('click', async () => {
            await cleanupConnection();
            connectToRoom(myId); 
        });

        ui.btnForceConnect.addEventListener('click', () => {
            startDevice();
        });

        // --- PTT & VIDEO LOGIC ---

        let isTransmitting = false;

        function startPTT(e) {
            e.preventDefault(); 
            if (!peerConnection || peerConnection.connectionState !== 'connected' || isTransmitting) return;
            
            isTransmitting = true;
            ui.btnPtt.classList.add('pressed');
            ui.lcd.classList.add('transmitting');
            
            playSfx('tx-start');
            if (localStream) {
                localStream.getAudioTracks().forEach(track => { track.enabled = true; });
            }
        }

        function stopPTT(e) {
            e.preventDefault();
            if (!isTransmitting) return;

            isTransmitting = false;
            ui.btnPtt.classList.remove('pressed');
            ui.lcd.classList.remove('transmitting');

            if (localStream) {
                localStream.getAudioTracks().forEach(track => { track.enabled = false; });
            }
            playSfx('tx-end');
        }

        ui.btnPtt.addEventListener('pointerdown', startPTT);
        ui.btnPtt.addEventListener('pointerup', stopPTT);
        ui.btnPtt.addEventListener('pointerleave', stopPTT);
        ui.btnPtt.addEventListener('pointercancel', stopPTT);

        function setupAudioLevelMonitor() {
            if (!audioContext || !remoteStream) return;
            const source = audioContext.createMediaStreamSource(remoteStream);
            const analyzer = audioContext.createAnalyser();
            analyzer.fftSize = 256;
            source.connect(analyzer);
            const dataArray = new Uint8Array(analyzer.frequencyBinCount);

            function checkLevel() {
                if (peerConnection && peerConnection.connectionState === 'connected') {
                    analyzer.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) { sum += dataArray[i]; }
                    const average = sum / dataArray.length;

                    ui.rxIndicator.style.opacity = (average > 5 && !isTransmitting) ? '1' : '0';
                    requestAnimationFrame(checkLevel);
                } else {
                    ui.rxIndicator.style.opacity = '0';
                }
            }
            checkLevel();
        }

        let isVideoEnabled = true;
        ui.btnToggleVideo.addEventListener('click', async () => {
            if (!localStream) return;
            if (isVideoEnabled) {
                const videoTrack = localStream.getVideoTracks()[0];
                if (videoTrack) {
                    videoTrack.stop(); 
                    localStream.removeTrack(videoTrack); 
                }
                isVideoEnabled = false;
                ui.videoIcon.innerText = "🚫";
                ui.videoBtnText.innerText = "Kamera: OFF";
                ui.localVideo.classList.add('opacity-20', 'grayscale');
            } else {
                try {
                    const newStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    const newVideoTrack = newStream.getVideoTracks()[0];
                    localStream.addTrack(newVideoTrack);
                    ui.localVideo.srcObject = localStream;
                    
                    if (peerConnection) {
                        const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (sender) sender.replaceTrack(newVideoTrack);
                        else peerConnection.addTrack(newVideoTrack, localStream);
                    }
                    isVideoEnabled = true;
                    ui.videoIcon.innerText = "📷";
                    ui.videoBtnText.innerText = "Kamera: ON";
                    ui.localVideo.classList.remove('opacity-20', 'grayscale');
                } catch (error) {}
            }
        });

        // --- UI TOGGLES ---

        function updateLCD(status, roomStr, icon) {
            ui.lcdStatus.innerText = status;
            ui.lcdRoomText.innerText = roomStr || "---";
            ui.statusIcon.innerText = icon || "";
        }

        function showCallPanel(activeRoomId) {
            ui.setupPanel.classList.add('hidden');
            ui.callPanel.classList.remove('hidden');
            ui.lcdRoomText.innerText = activeRoomId;
            if(isVideoEnabled) ui.lcd.classList.add('video-mode');
        }

        function showSetupPanel() {
            ui.setupPanel.classList.remove('hidden');
            ui.callPanel.classList.add('hidden');
            ui.lcdRoomText.innerText = myId;
            ui.lcd.classList.add('video-mode'); 
        }

        // Mulai aplikasi
        checkAuth();
        
        window.addEventListener('beforeunload', () => {
            cleanupConnection();
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
